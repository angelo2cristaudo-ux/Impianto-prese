<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impianto prese – computo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEA; --surface:#F8F9F6; --ink:#1E272B; --muted:#5D686B; --line:#CDD3CF;
  --fase:#8A4B2A; --neutro:#2D5C99; --terra:#3E8A3A; --giallo:#C2C832; --warn:#B3261E; --att:#9A6200;
  --plate:#FFFFFF; --slot:#D5DBD7;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151B1D; --surface:#1D2528; --ink:#E4EAE7; --muted:#9AA6A7; --line:#334044;
    --fase:#C9845A; --neutro:#7FA7DD; --terra:#79C072; --giallo:#C9D23A; --warn:#F2827A; --att:#E3B341;
    --plate:#2A3438; --slot:#3C4A4F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151B1D; --surface:#1D2528; --ink:#E4EAE7; --muted:#9AA6A7; --line:#334044;
  --fase:#C9845A; --neutro:#7FA7DD; --terra:#79C072; --giallo:#C9D23A; --warn:#F2827A; --att:#E3B341;
  --plate:#2A3438; --slot:#3C4A4F; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:62px}
select{padding-right:6px}
:focus-visible{outline:2px solid var(--neutro);outline-offset:2px}

/* Testata */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:1.3rem;margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--terra);flex:none}
.dot.saving{background:var(--giallo)} .dot.none{background:var(--warn)}
.grand{text-align:right}
.grand b{display:block;font-size:1.55rem;line-height:1.05;font-weight:700}
.grand span{font-size:.76rem;color:var(--muted)}
nav.tabs{max-width:880px;margin:0 auto;display:flex;gap:2px;padding:8px 6px 0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;font-weight:600;color:var(--muted);padding:8px 10px 11px;position:relative;white-space:nowrap;flex:none}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:4px;border-radius:2px 2px 0 0;
  background:linear-gradient(90deg,var(--fase) 0 33.3%,var(--neutro) 33.3% 66.6%,var(--terra) 66.6%)}
main{max-width:880px;margin:0 auto;padding:16px 16px 56px}

/* Pulsanti */
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--warn);border-color:transparent;padding-left:0;padding-right:0}
.x{border:0;background:none;color:var(--muted);width:34px;height:34px;font-size:1.25rem;line-height:1;border-radius:6px;flex:none}
.x:hover{color:var(--warn)}
.x.nb{font-size:1rem}
.x.nb.has{color:var(--att)}
.x.nb:hover{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row select{width:auto;flex:1;min-width:180px}
.note{font-size:.88rem;color:var(--muted);margin:0}
.warn{color:var(--warn);font-weight:500;margin:0;font-size:.88rem}
.att{color:var(--att);font-weight:600}
.empty{color:var(--muted);font-size:.92rem;margin:10px 0}
h2{font-size:1.05rem;margin:28px 0 8px}

/* Legenda */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 14px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:16px;border-radius:2px;display:inline-block;flex:none}
.sw.round{width:12px;height:12px;border-radius:50%}
.sw.sq{width:12px;height:12px;border-radius:2px}

/* Card (ambienti e composizioni) */
.room{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.room-h{display:flex;align-items:center;gap:10px;padding:14px 14px;width:100%;border:0;background:none;text-align:left}
.room-h .nm{font-weight:600;font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-h .meta{color:var(--muted);font-size:.9rem;white-space:nowrap}
.room-h .cost{font-weight:600;white-space:nowrap;min-width:78px;text-align:right}
.chev{transition:transform .15s;flex:none;color:var(--muted)}
.room.open .chev{transform:rotate(90deg)}
.tag{font-size:.72rem;font-weight:600;border:1px solid var(--neutro);color:var(--neutro);border-radius:4px;padding:0 5px}
.room-body{padding:4px 14px 16px;border-top:1px solid var(--line)}
.room-tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;padding:10px 0 6px}
.room-tools .field{flex:1;min-width:200px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:.95rem;padding:8px 0}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--ink);flex:none}
.addpt{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}
.addpt select{flex:1;min-width:200px;width:auto}
.addroom{display:flex;gap:8px;margin-top:16px}
.addroom input{flex:1}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.list .pt:last-child{border-bottom:0}

/* Punti */
.pt{border-bottom:1px solid var(--line)}
.pt-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 0;width:100%;border:0;background:none;text-align:left}
.pt-info{flex:1;min-width:130px}
.pt-info b{display:block;font-weight:600}
.pt-info small{display:block;color:var(--muted);font-size:.84rem}
.pt-info small.warn{color:var(--warn)}
.pt-info small.att{color:var(--att)}
.pt-cost{font-weight:600;white-space:nowrap}
.pt.open .pt-row{padding-bottom:6px}

/* Placca */
.plate{display:grid;grid-template-columns:repeat(var(--cols),24px);gap:2px;padding:6px 8px;background:var(--plate);
  border:1px solid var(--line);border-radius:8px;flex:none}
.plate.over{border-color:var(--warn);outline:2px solid var(--warn);outline-offset:1px}
.blk{height:34px;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;
  font:600 9px/1 "Barlow Semi Condensed","Barlow",sans-serif;letter-spacing:.02em}
.k-presa{background:var(--fase);color:#fff}
.k-comando{background:var(--ink);color:var(--surface)}
.k-segnale{background:var(--neutro);color:#fff}
.k-altro{background:var(--muted);color:var(--surface)}
.k-vuoto{background:repeating-linear-gradient(135deg,var(--slot) 0 2px,transparent 2px 6px);box-shadow:inset 0 0 0 1px var(--slot)}

/* Editor */
.ed{display:grid;gap:14px;padding:4px 0 16px}
.field{display:grid;gap:4px}
.field>span{font-size:.84rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:500;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg output{padding:8px 4px;min-width:50px;text-align:center;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;width:max-content}
.step button{border:0;background:none;width:36px;height:36px;font-size:1.15rem;line-height:1}
.step output{min-width:26px;text-align:center;font-weight:600}
.frl{display:grid;gap:6px;margin-bottom:8px}
.fr{display:flex;align-items:center;gap:6px}
.fr .n{flex:1;min-width:0}
.fr .n small{display:block;color:var(--muted);font-size:.8rem}
.fr .n small.att{color:var(--att)}
.fnote{display:grid;gap:6px;padding:4px 0 8px 18px;border-left:2px solid var(--line);margin-left:5px}
.notebox{display:grid;gap:6px}

/* Listino */
.lgrp h3{font-size:.95rem;margin:22px 0 6px;font-weight:600}
.lrow{display:grid;grid-template-columns:62px 1fr 62px 92px;grid-template-areas:"nome nome nome del" "sigla cat mod prezzo";gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.l-nome{grid-area:nome}.l-sigla{grid-area:sigla}.l-cat{grid-area:cat}.l-mod{grid-area:mod}.l-prezzo{grid-area:prezzo}.l-del{grid-area:del;justify-self:end}
.suf{display:flex;align-items:center;gap:4px}
.suf span{font-size:.82rem;color:var(--muted)}
.lhead{display:none}
@media (min-width:680px){
  .lrow{grid-template-columns:1fr 72px 150px 74px 104px 34px;grid-template-areas:"nome sigla cat mod prezzo del";border-bottom:0;padding:3px 0}
  .lhead{display:grid;grid-template-columns:1fr 72px 150px 74px 104px 34px;gap:6px;font-size:.8rem;color:var(--muted);margin-top:14px}
}

/* Pianta */
.pbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.pbar .grow{flex:1}
.pempty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;display:grid;gap:14px;justify-items:start}
.mapwrap{overflow:auto;max-height:64vh;background:var(--surface);border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.map{position:relative;min-width:100%}
.map img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
.map.arm{cursor:crosshair}
.mk{position:absolute;width:20px;height:20px;transform:translate(-50%,-50%);border:2px solid #fff;padding:0;touch-action:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.45);border-radius:50%;cursor:grab}
.mk.uomo{border-radius:3px}
.mk.sel{width:26px;height:26px;box-shadow:0 0 0 1px rgba(0,0,0,.45),0 0 0 4px var(--att);z-index:2}
.mk.dim{opacity:.28}
.mk i{position:absolute;top:-10px;right:-10px;width:15px;height:15px;border-radius:50%;background:var(--att);color:#fff;font:700 10px/15px "Barlow",sans-serif;font-style:normal;text-align:center}
.tray{margin-top:12px;display:grid;gap:10px}
.tray .row select{max-width:280px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;text-align:left}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip small{display:block;color:var(--muted);font-size:.8rem}
.hint{background:var(--surface);border-left:4px solid var(--ink);padding:8px 12px;border-radius:0 8px 8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.popc{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.popc small{display:block;color:var(--muted)}

/* Riepilogo */
.totbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.totbox>div{background:var(--surface);padding:12px 14px;display:grid;gap:4px;align-content:start}
.totbox>div>span{font-size:.86rem;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px}
.totbox b{font-size:1.3rem}
.totbox .tot b{font-size:1.6rem}
.ivap{width:96px}
.ivap input{padding:5px 8px}
.counts{margin:12px 0 0}
.warnbox{margin-top:14px;border-left:4px solid var(--warn);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0}
.warnbox.a{border-color:var(--att)}
.warnbox ul{margin:6px 0 0;padding-left:18px;font-size:.9rem}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.94rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font-size:.8rem;color:var(--muted);font-weight:600}
tbody tr:last-child td{border-bottom:0}
tfoot th,tfoot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700}
.r{text-align:right;white-space:nowrap}
td small{color:var(--muted)}

/* Dialoghi */
.modal{position:fixed;inset:0;background:rgba(10,16,18,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal>div{background:var(--surface);border-radius:12px;padding:18px;max-width:380px;width:100%;display:grid;gap:14px}
.modal p{margin:0}
.modal .row{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:60;font-size:.92rem;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div>
      <h1>Impianto prese</h1>
      <div class="status" role="status"><span class="dot saving" id="dot"></span><span id="status">Caricamento…</span></div>
    </div>
    <div class="grand"><b id="grand" class="num">0,00 €</b><span id="grandLbl">totale</span></div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-act="tab" data-tab="ambienti">Ambienti</button>
    <button class="tab" role="tab" data-act="tab" data-tab="composizioni">Composizioni</button>
    <button class="tab" role="tab" data-act="tab" data-tab="listino">Listino</button>
    <button class="tab" role="tab" data-act="tab" data-tab="pianta">Pianta</button>
    <button class="tab" role="tab" data-act="tab" data-tab="riepilogo">Riepilogo</button>
  </nav>
</header>
<main id="main"></main>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="imgIn" accept="image/*" hidden>

<script>
(function(){
"use strict";
const KEY = "impianto-prese-v1";
const KEY_IMG = "impianto-prese-v1-pianta";
const FORMATI = [3,4,7];
const ZOOMS = [1,1.5,2,3,4];
const CAT = ["Presa","Comando","Segnale","Altro","Copriforo","Scatola","Supporto","Placca","Placca esterno"];
const CAT_LABEL = {"Presa":"Prese","Comando":"Comandi","Segnale":"TV, dati e USB","Altro":"Altro (accessori, anche senza moduli)","Copriforo":"Copriforo","Scatola":"Scatole da incasso","Supporto":"Supporti (portaplacca)","Placca":"Placche","Placca esterno":"Placche da esterno IP55"};
const FRUTTO_CAT = ["Presa","Comando","Segnale","Altro"];
const MODELLI_BASE = [
  ["Presa bipasso + Schuko",3,"terra",[["10/16",1],["SCH",1]]],
  ["Due bipasso + USB-C",3,"terra",[["10/16",2],["USB-C",1]]],
  ["Tre bipasso",3,"terra",[["10/16",3]]],
  ["Presa USB-C + Schuko",3,"terra",[["USB-C",1],["SCH",1]]],
  ["Schuko singola",3,"terra",[["SCH",1]]],
  ["Bipasso singola",3,"terra",[["10/16",1]]],
  ["TV + dati",3,"terra",[["TV",1],["RJ45",1]]],
  ["Interruttore",3,"uomo",[["INT",1]]],
  ["Deviatore",3,"uomo",[["DEV",1]]],
  ["Due deviatori",3,"uomo",[["DEV",2]]],
  ["Invertitore",3,"uomo",[["INV",1]]],
  ["Pulsante",3,"uomo",[["PUL",1]]],
  ["Interruttore + bipasso",3,"uomo",[["INT",1],["10/16",1]]],
  ["Deviatore + bipasso",3,"uomo",[["DEV",1],["10/16",1]]],
  ["Due bipasso + Schuko",4,"terra",[["10/16",2],["SCH",1]]],
  ["Due Schuko",4,"terra",[["SCH",2]]],
  ["Schuko + bipasso + USB-C",4,"terra",[["SCH",1],["10/16",1],["USB-C",1]]],
  ["Postazione TV",7,"terra",[["TV",1],["RJ45",1],["10/16",1],["SCH",2]]],
  ["Piano cucina",7,"uomo",[["SCH",2],["10/16",3]]],
  ["Postazione scrivania",7,"terra",[["SCH",1],["10/16",2],["USB",1],["RJ45",1]]],
  ["Punto vuoto",3,"terra",[]]
];

const uid = () => Math.random().toString(36).slice(2,10);
const $ = s => document.querySelector(s);
const fmtEur = new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"});
const eur = n => fmtEur.format(n || 0);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(/\s/g,"").replace(",",".")); return isFinite(n) ? n : 0; };
const numStr = n => String(n).replace(".",",");
const use = name => (window.claude && typeof window.claude.use === "function") ? window.claude.use(name).catch(() => null) : Promise.resolve(null);

function defaultModelli(componenti){
  return MODELLI_BASE.map(([nome, formato, altezza, f]) => ({
    id:uid(), nome, formato, altezza, flag:false, nota:"",
    frutti: f.map(([sig, q]) => {
      const c = componenti.find(x => x.sigla === sig && FRUTTO_CAT.includes(x.categoria));
      return c ? {compId:c.id, qta:q, flag:false, nota:""} : null;
    }).filter(Boolean)
  }));
}
function defaultState(){
  const c = (nome,sigla,categoria,moduli,prezzo) => ({id:uid(),nome,sigla,categoria,moduli,prezzo});
  const componenti = [
    c("Presa bipasso 10/16 A","10/16","Presa",1,3.5),
    c("Presa Schuko universale","SCH","Presa",2,7.9),
    c("Presa USB-C","USB-C","Segnale",1,27),
    c("Presa USB A+C","USB","Segnale",2,32),
    c("Presa TV","TV","Segnale",1,8.5),
    c("Presa dati RJ45 Cat 6","RJ45","Segnale",1,12),
    c("Interruttore 1P 16 A","INT","Comando",1,4.2),
    c("Deviatore","DEV","Comando",1,4.8),
    c("Invertitore","INV","Comando",1,9.5),
    c("Pulsante","PUL","Comando",1,4.5),
    c("Copriforo","","Copriforo",1,0.9),
    c("Scatola 503","503","Scatola",3,0.6),
    c("Scatola 504","504","Scatola",4,0.9),
    c("Scatola 506","506","Scatola",7,1.4),
    c("Supporto 3 moduli","S3","Supporto",3,1.2),
    c("Supporto 4 moduli","S4","Supporto",4,1.6),
    c("Supporto 7 moduli","S7","Supporto",7,2.6),
    c("Placca 3 moduli","P3","Placca",3,3.5),
    c("Placca 4 moduli","P4","Placca",4,4.8),
    c("Placca 7 moduli","P7","Placca",7,7.5),
    c("Placca IP55 3 moduli","IP3","Placca esterno",3,12),
    c("Placca IP55 4 moduli","IP4","Placca esterno",4,14.5),
    c("Placca IP55 7 moduli","IP7","Placca esterno",7,21)
  ];
  const nomi = ["Corridoio","Cucina","Salotto","Stanza da letto PADRONALE","Stanza da letto per plebei","Bagno","Lavanderia","Sgabuzzino","Terrazzo"];
  return {
    versione:2, savedAt:0, iva:22, ivaAttiva:true, componenti,
    modelli: defaultModelli(componenti), pianta:null,
    ambienti: nomi.map(n => ({id:uid(), nome:n, esterno:n === "Terrazzo", punti:[]}))
  };
}

const normFrutti = arr => (Array.isArray(arr) ? arr : []).filter(f => f && f.compId).map(f => ({
  compId:String(f.compId), qta:Math.max(1, Math.round(num(f.qta)) || 1), flag:!!f.flag, nota:String(f.nota || "")
}));
function normalize(s){
  if(!s || !Array.isArray(s.componenti) || !Array.isArray(s.ambienti)) return null;
  delete s.piantaDataUrl;
  s.versione = 2;
  s.iva = isFinite(+s.iva) ? +s.iva : 22;
  s.ivaAttiva = s.ivaAttiva !== false;
  s.savedAt = +s.savedAt || 0;
  s.componenti = s.componenti.filter(Boolean).map(c => ({
    id:String(c.id || uid()), nome:String(c.nome || "Componente"), sigla:String(c.sigla || ""),
    categoria: CAT.includes(c.categoria) ? c.categoria : "Altro",
    moduli: Math.max(0, Math.round(num(c.moduli))), prezzo: Math.max(0, num(c.prezzo))
  }));
  s.modelli = Array.isArray(s.modelli) ? s.modelli.filter(Boolean).map(m => ({
    id:String(m.id || uid()), nome:String(m.nome || "Composizione"),
    formato: FORMATI.includes(+m.formato) ? +m.formato : 3,
    altezza: m.altezza === "uomo" ? "uomo" : "terra",
    flag:!!m.flag, nota:String(m.nota || ""), frutti:normFrutti(m.frutti)
  })) : defaultModelli(s.componenti);
  s.pianta = s.pianta && typeof s.pianta === "object" ? {assetId:s.pianta.assetId ? String(s.pianta.assetId) : null, w:+s.pianta.w || 0, h:+s.pianta.h || 0} : null;
  s.ambienti = s.ambienti.filter(Boolean).map(a => ({
    id:String(a.id || uid()), nome:String(a.nome || "Ambiente"), esterno:!!a.esterno,
    punti:(Array.isArray(a.punti) ? a.punti : []).filter(Boolean).map(p => {
      const qta = Math.max(1, Math.round(num(p.qta)) || 1);
      return {
        id:String(p.id || uid()), nome:String(p.nome || "Punto"), qta,
        altezza: p.altezza === "uomo" ? "uomo" : "terra",
        formato: FORMATI.includes(+p.formato) ? +p.formato : 3,
        flag:!!p.flag, nota:String(p.nota || ""),
        pos:(Array.isArray(p.pos) ? p.pos : []).filter(q => q && isFinite(+q.x) && isFinite(+q.y)).slice(0, qta).map(q => ({x:+q.x, y:+q.y})),
        frutti:normFrutti(p.frutti)
      };
    })
  }));
  return s;
}

/* ---------- Stato e salvataggio automatico ---------- */
let localOk = true;
function loadLocal(){
  try { const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : null; }
  catch(e){ localOk = false; return null; }
}
let state = loadLocal() || defaultState();

  zoom:1, arm:null, sel:null, pRoom:"", srcFailed:false};

let dbRef = null, saveTimer = null, dirty = false;
function setStatus(kind){
  const t = new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  const map = {
    saving:["saving","Salvataggio…"],
    cloud:["", "Salvato alle " + t],
    local:["", "Salvato sul dispositivo alle " + t],
    none:["none","Salvataggio automatico non disponibile: scarica un backup"],
    error:["none","Ultimo salvataggio non riuscito, riprovo alla prossima modifica"]
  };
  const m = map[kind];
  $("#dot").className = "dot " + m[0];
  $("#status").textContent = m[1];
}
function scheduleSave(){
  state.savedAt = Date.now();
  dirty = true;
  setStatus("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 600);
}
async function persist(){
  clearTimeout(saveTimer);
  if(!dirty) return;
  dirty = false;
  const json = JSON.stringify(state);
  let ok = false;
  try { localStorage.setItem(KEY, json); ok = true; localOk = true; } catch(e){ localOk = false; }
  if(dbRef){
    try { await dbRef.set({json, savedAt:state.savedAt}); setStatus("cloud"); return; }
    catch(e){ setStatus(ok ? "local" : "error"); return; }
  }
  setStatus(ok ? "local" : "none");
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") persist(); });
window.addEventListener("pagehide", persist);

async function initCloud(){
  const [db, user] = await Promise.all([use("db"), use("user")]);
  let id = null;
  if(db && user){ try { id = await user.id(); } catch(e){ id = null; } }
  if(!db || !id){
    if(!dirty) setStatus(localOk ? "local" : "none");
    return;
  }
  const ref = db.collection("data/users/" + id).doc("impianto");
  try {
    const snap = await ref.get();
    const d = snap.exists ? (snap.data() || {}) : null;
    if(d){
      const remote = typeof d.json === "string" ? normalize(JSON.parse(d.json)) : null;
      if(remote && remote.savedAt > (state.savedAt || 0)){
        state = remote;
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
        render();
      }
    }
    dbRef = ref;
    if(state.savedAt && (!d || (+d.savedAt || 0) < state.savedAt)){ dirty = true; await persist(); }
    else if(!dirty) setStatus("cloud");
  } catch(e){
    if(!dirty) setStatus(localOk ? "local" : "none");
  }
}

/* ---------- Calcoli ---------- */
const comp = id => state.componenti.find(c => c.id === id);
const autoComp = (cat, mod) => state.componenti.find(c => c.categoria === cat && +c.moduli === +mod);
const catKey = cat => ({"Presa":"presa","Comando":"comando","Segnale":"segnale"}[cat] || "altro");
const hasAtt = o => !!(o.flag || o.frutti.some(f => f.flag));
const hasNote = o => !!(o.nota || o.frutti.some(f => f.nota));

function calcPunto(p, a){
  const lines = [], warn = [];
  let used = 0;
  for(const f of p.frutti){
    const c = comp(f.compId);
    if(!c) continue;
    used += (+c.moduli || 0) * f.qta;
    lines.push({c, q:f.qta});
  }
  const free = Math.max(0, p.formato - used);
  if(used > p.formato) warn.push(used + " moduli di frutti in una placca da " + p.formato + ": aumenta il formato o togli un frutto");
  if(free > 0){
    const cp = state.componenti.find(c => c.categoria === "Copriforo");
    if(cp) lines.push({c:cp, q:free, auto:true}); else warn.push("Manca il copriforo nel listino");
  }
  const autos = [];
  for(const cat of ["Scatola","Supporto", a.esterno ? "Placca esterno" : "Placca"]){
    const c = autoComp(cat, p.formato);
    if(c){ lines.push({c, q:1, auto:true}); autos.push(c.nome); }
    else warn.push("Manca nel listino: " + cat.toLowerCase() + " da " + p.formato + " moduli");
  }
  const unit = lines.reduce((s,l) => s + l.c.prezzo * l.q, 0);
  return {lines, used, free, warn, autos, unit, tot:unit * (p.qta || 1)};
}

function totals(){
  const bom = new Map(), perAmb = [], warns = [];
  let imp = 0, punti = 0, terra = 0, uomo = 0, piazzati = 0;
  for(const a of state.ambienti){
    let at = 0, ap = 0;
    for(const p of a.punti){
      const r = calcPunto(p, a);
      at += r.tot; ap += p.qta; piazzati += p.pos.length;
      if(p.altezza === "terra") terra += p.qta; else uomo += p.qta;
      r.warn.forEach(w => warns.push(a.nome + ", " + p.nome + ": " + w));
      for(const l of r.lines){
        const e = bom.get(l.c.id) || {c:l.c, q:0};
        e.q += l.q * p.qta;
        bom.set(l.c.id, e);
      }
    }
    imp += at; punti += ap;
    perAmb.push({a, tot:at, punti:ap});
  }
  const iva = state.ivaAttiva ? imp * state.iva / 100 : 0;
  const bomArr = [...bom.values()].sort((x,y) => CAT.indexOf(x.c.categoria) - CAT.indexOf(y.c.categoria) || x.c.nome.localeCompare(y.c.nome,"it"));
  return {bom:bomArr, imp, iva, tot:imp + iva, punti, terra, uomo, piazzati, warns, perAmb};
}

function noteList(){
  const out = [];
  for(const a of state.ambienti) for(const p of a.punti){
    if(p.flag || p.nota) out.push({a, p, el:"Punto", flag:p.flag, testo:p.nota});
    for(const f of p.frutti){
      if(!(f.flag || f.nota)) continue;
      const c = comp(f.compId);
      out.push({a, p, el:c ? c.nome : "Frutto", flag:f.flag, testo:f.nota});
    }
  }
  return out.sort((x,y) => (y.flag - x.flag));
}

/* ---------- Pezzi di interfaccia ---------- */
function plateHTML(p){
  const cols = p.formato;
  let html = "", pos = 0, over = false;
  for(const f of p.frutti){
    const c = comp(f.compId);
    if(!c || !(+c.moduli > 0)) continue;
    for(let i = 0; i < f.qta; i++){
      const m = +c.moduli;
      if(pos + m > cols){ over = true; continue; }
      html += '<span class="blk k-' + catKey(c.categoria) + '" style="grid-column:span ' + m + '">' + esc(c.sigla) + '</span>';
      pos += m;
    }
  }
  for(; pos < cols; pos++) html += '<span class="blk k-vuoto"></span>';
  return '<span class="plate' + (over ? ' over' : '') + '" style="--cols:' + cols + '" aria-hidden="true">' + html + '</span>';
}

  const di = i == null ? "" : ' data-i="' + i + '"';

};

async function loadImage(url){
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
}
async function caricaPianta(file){
  toast("Carico la planimetria…");
  let im;
  const u = URL.createObjectURL(file);
  try { im = await loadImage(u); } catch(e){ toast("Immagine non leggibile: prova con JPG o PNG"); return; }
  finally { URL.revokeObjectURL(u); }
  const max = 2200, sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.round(im.naturalWidth * sc), h = Math.round(im.naturalHeight * sc);
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const cx = cv.getContext("2d");
  cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h);
  cx.drawImage(im, 0, 0, w, h);
  const dataUrl = cv.toDataURL("image/jpeg", 0.85);
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
  piantaLocal = dataUrl;
  try { localStorage.setItem(KEY_IMG, dataUrl); } catch(e){}
  const oldId = state.pianta && state.pianta.assetId;
  let assetId = null;
  const assets = await use("assets");
  if(assets && blob){
    try { const r = await assets.upload(blob, {type:"image/jpeg"}); assetId = r.id; } catch(e){ assetId = null; }
    if(oldId && assetId){ try { await assets.delete(oldId); } catch(e){} }
  }
  state.pianta = {assetId, w, h};
  ui.srcFailed = false;
  scheduleSave(); render();
  toast(assetId ? "Planimetria caricata e salvata nel progetto" : "Planimetria caricata su questo dispositivo");
}

let drag = null;
document.addEventListener("pointerdown", e => {
  const m = e.target.closest(".mk");
  if(!m) return;
  e.preventDefault();
  const rect = $("#map").getBoundingClientRect();
  drag = {el:m, pid:m.dataset.pid, i:+m.dataset.ui, sx:e.clientX, sy:e.clientY, rect, moved:false, x:0, y:0};
  try { m.setPointerCapture(e.pointerId); } catch(err){}
});
document.addEventListener("pointermove", e => {
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
  drag.moved = true;
  drag.x = Math.min(1, Math.max(0, (e.clientX - drag.rect.left) / drag.rect.width));
  drag.y = Math.min(1, Math.max(0, (e.clientY - drag.rect.top) / drag.rect.height));
  drag.el.style.left = (drag.x * 100) + "%";
  drag.el.style.top = (drag.y * 100) + "%";
});
function endDrag(){
  if(!drag) return;
  const d = drag; drag = null;
  const {p} = findP(d.pid);
  if(!p) return;
  if(d.moved){ p.pos[d.i] = {x:d.x, y:d.y}; ui.sel = {pid:d.pid, i:d.i}; scheduleSave(); }
  else { ui.sel = (ui.sel && ui.sel.pid === d.pid && ui.sel.i === d.i) ? null : {pid:d.pid, i:d.i}; ui.arm = null; }
  refreshPianta();
}

document.addEventListener("click", e => {
  const map = e.target.closest("#map");

  if(ui.arm){
    const {p} = findP(ui.arm);
    if(!p || p.pos.length >= p.qta){ ui.arm = null; refreshPianta(); return; }
    const r = map.getBoundingClientRect();
    if(!r.width || !r.height) return;
    p.pos.push({x:Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y:Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))});

    ui.sel = null;

});

async function saveFile(name, text, mime){

function buildCsv(){
  const t = totals();
  const fix = n => (n || 0).toFixed(2).replace(".",",");
  const cell = v => { v = String(v == null ? "" : v); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const notes = noteList();
  const rows = [];
  if(notes.some(n => n.flag)){
    rows.push(["ATTENZIONE: ci sono note da attenzionare, vedi la sezione Note e accorgimenti"], []);
  }
  rows.push(["Distinta materiali"],["Componente","Categoria","Moduli","Quantità","Prezzo unitario","Importo"]);
  t.bom.forEach(e => rows.push([e.c.nome, e.c.categoria, e.c.moduli, e.q, fix(e.c.prezzo), fix(e.c.prezzo * e.q)]));
  rows.push([], ["Imponibile","","","","",fix(t.imp)]);
  if(state.ivaAttiva) rows.push(["IVA " + numStr(state.iva) + "%","","","","",fix(t.iva)]);
  rows.push(["Totale","","","","",fix(t.tot)], [], ["Per ambiente"], ["Ambiente","Punti","Importo"]);
  t.perAmb.forEach(x => rows.push([x.a.nome, x.punti, fix(x.tot)]));
  rows.push([], ["Dettaglio punti"], ["Ambiente","Punto","Quantità","Posizione","Formato","Frutti","Importo","Da attenzionare","Note"]);
  state.ambienti.forEach(a => a.punti.forEach(p => {
    const r = calcPunto(p, a);
    const fr = p.frutti.map(f => { const c = comp(f.compId); return c ? f.qta + "× " + c.nome : ""; }).filter(Boolean).join(", ");
    const nt = [p.nota].concat(p.frutti.filter(f => f.nota).map(f => { const c = comp(f.compId); return (c ? c.nome + ": " : "") + f.nota; })).filter(Boolean).join(" | ");
    rows.push([a.nome, p.nome, p.qta, p.altezza === "terra" ? "A terra" : "Altezza uomo", p.formato + " moduli", fr, fix(r.tot), hasAtt(p) ? "SÌ" : "", nt]);
  }));
  if(notes.length){
    rows.push([], ["Note e accorgimenti"], ["Ambiente","Punto","Elemento","Da attenzionare","Nota"]);
    notes.forEach(n => rows.push([n.a.nome, n.p.nome, n.el, n.flag ? "SÌ" : "", n.testo]));
  }
  return "\ufeff" + rows.map(r => r.map(cell).join(";")).join("\r\n");
}

}

  const {a, p, c, m, o} = ctx(t);
  switch(act){
    case "tab": ui.tab = t.dataset.tab; ui.arm = null; render(); window.scrollTo(0,0); break;
    case "toggleRoom":
      if(ui.openRooms.has(a.id)) ui.openRooms.delete(a.id); else ui.openRooms.add(a.id);
      render(); break;
    case "addRoom": {
      const inp = $("#newRoom");
      const nome = (inp.value || "").trim() || "Nuovo ambiente";
      const r = {id:uid(), nome, esterno:false, punti:[]};
      state.ambienti.push(r); ui.openRooms.add(r.id);
      changed(); break;
    }
    case "delRoom":
      if(await ask("Eliminare «" + a.nome + "» con tutti i suoi punti?", "Elimina ambiente")){
        state.ambienti = state.ambienti.filter(x => x !== a); changed();
      }
      break;
    case "addPoint": {
      const sel = t.closest(".room-body").querySelector('[data-sel="preset"]');
      const md = state.modelli.find(x => x.id === sel.value);
      if(!md) break;
      ui.preset = md.id;
      const np = {id:uid(), nome:md.nome, qta:1, altezza:md.altezza, formato:md.formato, flag:!!md.flag, nota:md.nota || "", pos:[], frutti:copyFrutti(md.frutti)};
      a.punti.push(np); ui.openPoint = np.id;
      changed(); break;
    }
    case "togglePoint": ui.openPoint = ui.openPoint === p.id ? null : p.id; render(); break;
    case "toggleModel": ui.openModel = ui.openModel === m.id ? null : m.id; render(); break;
    case "ptQty":
      p.qta = Math.max(1, p.qta + d);
      if(p.pos.length > p.qta) p.pos.length = p.qta;
      changed(); break;
    case "oAlt": o.altezza = t.dataset.v; changed(); break;
    case "oFmt": o.formato = +t.dataset.v; changed(); break;
    case "frQty":
      o.frutti[i].qta += d;
      if(o.frutti[i].qta < 1){ o.frutti.splice(i, 1); ui.noteOpen.clear(); }
      changed(); break;
    case "frDel": o.frutti.splice(i, 1); ui.noteOpen.clear(); changed(); break;
    case "fNote": {
      const key = o.id + ":" + i;
      if(ui.noteOpen.has(key)) ui.noteOpen.delete(key); else ui.noteOpen.add(key);
      render();
      if(ui.noteOpen.has(key)){ const inp = document.querySelector('[data-f="fNota"][data-i="' + i + '"]'); if(inp) inp.focus(); }
      break;
    }
    case "frAdd": {
      const sel = t.closest(".ed").querySelector('[data-sel="frutto"]');
      if(!sel || !sel.value) break;
      const ex = o.frutti.find(f => f.compId === sel.value && !f.nota && !f.flag);
      if(ex) ex.qta++; else o.frutti.push({compId:sel.value, qta:1, flag:false, nota:""});
      changed(); break;
    }
    case "ptDup": {
      const cp = JSON.parse(JSON.stringify(p));
      cp.id = uid(); cp.nome = p.nome + " (copia)"; cp.pos = [];
      a.punti.splice(a.punti.indexOf(p) + 1, 0, cp); ui.openPoint = cp.id;
      changed(); break;
    }
    case "ptSave": {
      const nm = {id:uid(), nome:p.nome, formato:p.formato, altezza:p.altezza, flag:p.flag, nota:p.nota, frutti:copyFrutti(p.frutti)};
      state.modelli.push(nm); ui.preset = nm.id;
      scheduleSave(); toast("Composizione «" + p.nome + "» salvata");
      break;
    }
    case "ptDel":
      if(await ask("Eliminare il punto «" + p.nome + "»?", "Elimina punto")){
        a.punti = a.punti.filter(x => x !== p); changed();
      }
      break;
    case "mAdd": {
      const nm = {id:uid(), nome:"Nuova composizione", formato:3, altezza:"terra", flag:false, nota:"", frutti:[]};
      state.modelli.push(nm); ui.openModel = nm.id;
      changed();
      const inp = document.querySelector('[data-m="' + nm.id + '"] [data-f="oNome"]');
      if(inp){ inp.scrollIntoView({block:"center"}); inp.focus(); inp.select(); }
      break;
    }
    case "mDup": {
      const cp = JSON.parse(JSON.stringify(m));
      cp.id = uid(); cp.nome = m.nome + " (copia)";
      state.modelli.splice(state.modelli.indexOf(m) + 1, 0, cp); ui.openModel = cp.id;
      changed(); break;
    }
    case "mDel":
      if(await ask("Eliminare la composizione «" + m.nome + "»? I punti già inseriti restano come sono.", "Elimina composizione")){
        state.modelli = state.modelli.filter(x => x !== m); changed();
      }
      break;
    case "addComp": {
      const nc = {id:uid(), nome:"Nuovo componente", sigla:"", categoria:"Presa", moduli:1, prezzo:0};
      state.componenti.push(nc); changed();
      const inp = document.querySelector('[data-c="' + nc.id + '"] .l-nome');
      if(inp){ inp.scrollIntoView({block:"center"}); inp.focus(); inp.select(); }
      break;
    }
    case "delComp": {
      const inUso = state.ambienti.reduce((n, aa) => n + aa.punti.filter(pp => pp.frutti.some(f => f.compId === c.id)).length, 0);
      const msg = inUso ? "«" + c.nome + "» è usato in " + inUso + (inUso === 1 ? " punto" : " punti") + ": verrà tolto anche da lì e dalle composizioni. Eliminare?" : "Eliminare «" + c.nome + "» dal listino?";
      if(await ask(msg, "Elimina componente")){
        state.componenti = state.componenti.filter(x => x !== c);
        state.ambienti.forEach(aa => aa.punti.forEach(pp => { pp.frutti = pp.frutti.filter(f => f.compId !== c.id); }));
        state.modelli.forEach(mm => { mm.frutti = mm.frutti.filter(f => f.compId !== c.id); });
        changed();
      }
      break;
    }
    case "pUpload": $("#imgIn").click(); break;
    case "pRemove":
      if(await ask("Rimuovere la planimetria? Le posizioni dei punti vengono cancellate.", "Rimuovi")){
        const oldId = state.pianta && state.pianta.assetId;
        state.pianta = null; piantaLocal = null;
        try { localStorage.removeItem(KEY_IMG); } catch(err){}
        state.ambienti.forEach(aa => aa.punti.forEach(pp => { pp.pos = []; }));
        ui.sel = null; ui.arm = null;
        changed();
        if(oldId){ const assets = await use("assets"); if(assets){ try { await assets.delete(oldId); } catch(err){} } }
      }
      break;
    case "pZoom": {
      const k = Math.max(0, Math.min(ZOOMS.length - 1, ZOOMS.indexOf(ui.zoom) + d));
      ui.zoom = ZOOMS[k];
      $("#map").style.width = (ui.zoom * 100) + "%";
      $("#zl").textContent = Math.round(ui.zoom * 100) + "%";
      break;
    }
    case "pArm": ui.arm = ui.arm === t.dataset.pid ? null : t.dataset.pid; ui.sel = null; refreshPianta(); break;
    case "pDisarm": ui.arm = null; refreshPianta(); break;
    case "pClose": ui.sel = null; refreshPianta(); break;
    case "pUnplace": {
      const {p:pp} = findP(ui.sel.pid);
      if(pp){ pp.pos.splice(ui.sel.i, 1); scheduleSave(); }
      ui.sel = null; refreshPianta(); break;
    }
    case "pOpen": {
      const {a:aa, p:pp} = findP(ui.sel.pid);
      if(!pp) break;
      ui.tab = "ambienti"; ui.openRooms.add(aa.id); ui.openPoint = pp.id; ui.sel = null;
      render();
      const el = document.querySelector('[data-p="' + pp.id + '"]');
      if(el) el.scrollIntoView({block:"start"});
      break;
    }
    case "exportCsv": saveFile("impianto-prese-" + stamp() + ".csv", buildCsv(), "text/csv"); break;
    case "exportJson": {
      persist();
      const out = JSON.parse(JSON.stringify(state));
      const img = await srcToDataUrl(piantaLocal || piantaSrc());
      if(img) out.piantaDataUrl = img;
      saveFile("impianto-prese-backup-" + stamp() + ".json", JSON.stringify(out), "application/json");
      break;
    }
    case "importJson": $("#fileIn").click(); break;
    case "resetAll":
      if(await ask("Ambienti, punti, composizioni e prezzi torneranno ai valori iniziali; la planimetria resta. Conviene scaricare prima un backup. Continuare?", "Ricomincia")){
        const keep = state.savedAt, pianta = state.pianta;
        state = defaultState(); state.savedAt = keep; state.pianta = pianta;
        ui.openRooms.clear(); ui.openPoint = null; ui.openModel = null; ui.sel = null; ui.arm = null; ui.preset = null;
        changed();
      }
      break;
  }
});

document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "newRoom"){ e.preventDefault(); document.querySelector('[data-act="addRoom"]').click(); }
  if(e.key === "Escape" && ui.tab === "pianta" && (ui.arm || ui.sel)){ ui.arm = null; ui.sel = null; refreshPianta(); }
});

/* Testo e numeri: aggiornano stato e totali senza ridisegnare, così il cursore resta dove sta */
document.addEventListener("input", e => {
  const el = e.target, f = el.dataset.f;
  if(!f || el.type === "checkbox" || el.tagName === "SELECT") return;
  const {a, c, o} = ctx(el);
  const i = +el.dataset.i;
  switch(f){
    case "roomName": a.nome = el.value; { const l = document.querySelector('[data-oname="' + a.id + '"]'); if(l) l.textContent = el.value; } break;
    case "oNome": o.nome = el.value; { const l = document.querySelector('[data-oname="' + o.id + '"]'); if(l) l.textContent = el.value; } break;
    case "oNota": o.nota = el.value; break;
    case "fNota": if(o.frutti[i]) o.frutti[i].nota = el.value; break;
    case "cNome": c.nome = el.value; break;
    case "cSigla": c.sigla = el.value; break;
    case "cMod": c.moduli = Math.max(0, Math.round(num(el.value))); break;
    case "cPrezzo": c.prezzo = Math.max(0, num(el.value)); break;
    case "iva": state.iva = Math.max(0, num(el.value)); break;
    default: return;
  }
  scheduleSave(); updateTotals();
});
document.addEventListener("change", e => {
  const el = e.target, f = el.dataset.f;
  if(el.id === "pRoom"){ ui.pRoom = el.value; ui.sel = null; refreshPianta(); return; }
  if(!f) return;
  const {a, c, o} = ctx(el);
  const i = +el.dataset.i;
  if(f === "roomExt"){ a.esterno = el.checked; changed(); }
  else if(f === "ivaOn"){ state.ivaAttiva = el.checked; changed(); }
  else if(f === "cCat"){ c.categoria = el.value; changed(); }
  else if(f === "oFlag"){ o.flag = el.checked; changed(); }
  else if(f === "fFlag"){ if(o.frutti[i]) o.frutti[i].flag = el.checked; changed(); }
});

render();
initCloud();
})();
</script>
</body>
</html>
